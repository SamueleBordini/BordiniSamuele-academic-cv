bio: |
  I am a PhD Student and Researcher in Robotics at the University of Pisa. My research focuses on developing robotic control theory for robots with elasticity. I work on a humanoid with a Variable Stiffness Actuators based arm, introducing it in applications in healthcare and domestic scenarios.

